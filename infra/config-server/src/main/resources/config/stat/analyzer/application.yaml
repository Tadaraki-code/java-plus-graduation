server:
  port: 0

grpc:
  server:
    port: 0

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6542/analyzer
    username: stat
    password: stat

kafka:
  bootstrap-servers: localhost:9092
  topic:
    actions: stats.user-actions.v1
    similarity: stats.events-similarity.v1